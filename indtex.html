<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Bill Splitter</title>
    <!-- Tailwind CSS CDN for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-amber-50 to-orange-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-6 sm:p-8 space-y-6">
        <div class="text-center">
            <h1 class="text-2xl font-bold text-gray-800">🍽️ Bill Splitter</h1>
            <p class="text-sm text-gray-500 mt-1">Easily split your restaurant bill and add tips</p>
        </div>

        <div class="space-y-4">
            <!-- Total Bill Input -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Total Bill Amount (₹)</label>
                <input type="number" id="billAmount" value="1200" min="0" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 focus:outline-none" oninput="calculateSplit()">
            </div>

            <!-- Number of People Input -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Number of People</label>
                <input type="number" id="numPeople" value="4" min="1" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 focus:outline-none" oninput="calculateSplit()">
                <p class="text-xs text-gray-400 mt-1">Ravi + 3 friends = 4 people</p>
            </div>

            <!-- Tip Percentage Buttons / Input -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Tip Percentage (%)</label>
                <div class="grid grid-cols-4 gap-2 mb-2">
                    <button type="button" onclick="setTip(0)" class="tip-btn py-2 border rounded-lg text-sm font-semibold text-gray-700 hover:bg-orange-50 focus:bg-orange-500 focus:text-white transition">0%</button>
                    <button type="button" onclick="setTip(5)" class="tip-btn py-2 border rounded-lg text-sm font-semibold text-gray-700 hover:bg-orange-50 focus:bg-orange-500 focus:text-white transition">5%</button>
                    <button type="button" onclick="setTip(10)" class="tip-btn py-2 border rounded-lg text-sm font-semibold text-gray-700 hover:bg-orange-50 focus:bg-orange-500 focus:text-white transition bg-orange-500 text-white">10%</button>
                    <button type="button" onclick="setTip(15)" class="tip-btn py-2 border rounded-lg text-sm font-semibold text-gray-700 hover:bg-orange-50 focus:bg-orange-500 focus:text-white transition">15%</button>
                </div>
                <input type="number" id="tipPercentage" value="10" min="0" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 focus:outline-none" oninput="calculateSplit()">
            </div>
        </div>

        <!-- Results Card -->
        <div class="bg-orange-50 rounded-xl p-4 space-y-3 border border-orange-100">
            <div class="flex justify-between text-sm text-gray-600">
                <span>Tip Amount:</span>
                <span id="tipAmountDisplay" class="font-semibold text-gray-800">₹120.00</span>
            </div>
            <div class="flex justify-between text-sm text-gray-600">
                <span>Total with Tip:</span>
                <span id="totalWithTipDisplay" class="font-semibold text-gray-800">₹1,320.00</span>
            </div>
            <hr class="border-orange-200">
            <div class="flex justify-between items-center">
                <span class="text-base font-bold text-gray-800">Per Person:</span>
                <span id="perPersonDisplay" class="text-2xl font-extrabold text-orange-600">₹330.00</span>
            </div>
        </div>
    </div>

    <script>
        function setTip(percentage) {
            document.getElementById('tipPercentage').value = percentage;
            
            // Highlight active button
            const buttons = document.querySelectorAll('.tip-btn');
            buttons.forEach(btn => {
                if (btn.innerText.includes(percentage + '%')) {
                    btn.classList.add('bg-orange-500', 'text-white');
                    btn.classList.remove('text-gray-700');
                } else {
                    btn.classList.remove('bg-orange-500', 'text-white');
                    btn.classList.add('text-gray-700');
                }
            });

            calculateSplit();
        }

        function calculateSplit() {
            const bill = parseFloat(document.getElementById('billAmount').value) || 0;
            const people = parseInt(document.getElementById('numPeople').value) || 1;
            const tipPercent = parseFloat(document.getElementById('tipPercentage').value) || 0;

            const tipAmount = (bill * tipPercent) / 100;
            const total = bill + tipAmount;
            const perPerson = total / people;

            document.getElementById('tipAmountDisplay').innerText = `₹${tipAmount.toFixed(2)}`;
            document.getElementById('totalWithTipDisplay').innerText = `₹${total.toFixed(2)}`;
            document.getElementById('perPersonDisplay').innerText = `₹${perPerson.toFixed(2)}`;
        }

        // Run initial calculation on load
        calculateSplit();
    </script>
</body>
</html>
